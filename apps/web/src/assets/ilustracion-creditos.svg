  <circle cx="261" cy="182" r="119" stroke="#DCEADF" stroke-width="1" stroke-dasharray="4 7"/>
  <circle cx="420" cy="70" r="27" fill="#E2EFE5"/>
  <circle cx="98" cy="303" r="32" fill="#E5F1E8"/>
