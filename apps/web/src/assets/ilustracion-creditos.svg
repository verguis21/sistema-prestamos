<svg xmlns="http://www.w3.org/2000/svg" width="520" height="370" viewBox="0 0 520 370" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ilustración de gestión de créditos</title>
  <desc id="desc">Contrato de crédito aprobado acompañado de un gráfico de crecimiento y monedas estilizadas en tonos verde salvia.</desc>
  <defs>
    <linearGradient id="sheet" x1="180" y1="77" x2="352" y2="299" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5FBF6"/>
    </linearGradient>
    <linearGradient id="coin" x1="378" y1="216" x2="455" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7E3CB"/><stop offset="1" stop-color="#8DBEA1"/>
    </linearGradient>
    <linearGradient id="chart" x1="48" y1="240" x2="200" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2F1E6"/><stop offset="1" stop-color="#C1DFCB"/>
    </linearGradient>
    <filter id="shadow" x="100" y="15" width="350" height="360" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="19" flood-color="#2D5941" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Fondo geométrico de bajo contraste -->
