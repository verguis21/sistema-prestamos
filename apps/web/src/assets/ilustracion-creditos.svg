  </g>
  <rect x="192" y="74" width="156" height="44" rx="12" fill="#EAF4EC"/>
  <rect x="205" y="86" width="31" height="20" rx="7" fill="#B9D7C2"/>
  <path d="M214 98h13m-10-6v13" stroke="#2D6C4E" stroke-width="2.7" stroke-linecap="round"/>
  <rect x="247" y="87" width="81" height="7" rx="3.5" fill="#47735B"/>
